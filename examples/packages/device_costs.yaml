    availability: |-
      {{ has_value('sensor.hass_energy_device_heat_pump_monthly') and has_value('sensor.hass_energy_marginal_price') }}
    attributes:
      room: Utility room
      category: heating
  - name: Heat pump cost settlement period
    unique_id: hass_energy_cost_heat_pump_settlement
    default_entity_id: sensor.hass_energy_cost_heat_pump_settlement
    state_class: total
    unit_of_measurement: Ft
    state: |-
      {% set subsidized = states('sensor.hass_energy_device_heat_pump_settlement_subsidized') | float(0) %}
      {% set unsubsidized = states('sensor.hass_energy_device_heat_pump_settlement_unsubsidized') | float(0) %}
      {{ (subsidized * 36.386 + unsubsidized * 70.104) | round(2) }}
    availability: |-
      {{ has_value('sensor.hass_energy_device_heat_pump_settlement_subsidized') and has_value('sensor.hass_energy_device_heat_pump_settlement_unsubsidized') }}
    attributes:
