# Generated by hass-energy. Do not edit this file by hand; edits are lost on the next run.
# Change the project configuration or the generator instead.
#
# Where this settlement period is heading if consumption continues at the rate so far: the
# projected energy and cost at settlement, and the date the subsidized allowance runs out.
# A straight-line estimate, so it is least reliable early in the period and across a
# change of season.

template:
- sensor:
  - name: Days into the settlement period
    unique_id: hass_energy_settlement_days_elapsed
    default_entity_id: sensor.hass_energy_settlement_days_elapsed
    state_class: measurement
    unit_of_measurement: d
    state: |-
      {% set month = 3 %}{% set day = 15 %}
      {% set started_this_year = now().month > month or (now().month == month and now().day >= day) %}
      {% set year = now().year if started_this_year else now().year - 1 %}
      {% set start = now().replace(year=year, month=month, day=day, hour=0, minute=0, second=0, microsecond=0) %}
      {{ ((now() - start).total_seconds() / 86400) | round(2) }}
  - name: Days left in the settlement period
    unique_id: hass_energy_settlement_days_remaining
    default_entity_id: sensor.hass_energy_settlement_days_remaining
    state_class: measurement
    unit_of_measurement: d
    state: |-
      {% set month = 3 %}{% set day = 15 %}
      {% set started_this_year = now().month > month or (now().month == month and now().day >= day) %}
      {% set year = now().year if started_this_year else now().year - 1 %}
      {% set start = now().replace(year=year, month=month, day=day, hour=0, minute=0, second=0, microsecond=0) %}
      {% set next_start = start.replace(year=start.year + 1) %}
      {{ ((next_start - now()).total_seconds() / 86400) | round(2) }}
  - name: Average daily consumption this settlement period
    unique_id: hass_energy_settlement_daily_rate
    default_entity_id: sensor.hass_energy_settlement_daily_rate
    state_class: measurement
    unit_of_measurement: kWh/d
    state: |-
      {% set used = states('sensor.hass_energy_settlement_energy') | float(0) %}
      {% set days = states('sensor.hass_energy_settlement_days_elapsed') | float(0) %}
      {{ (used / days) | round(3) if days > 0 else 0 }}
    availability: |-
      {{ has_value('sensor.hass_energy_settlement_energy') and has_value('sensor.hass_energy_settlement_days_elapsed') }}
  - name: Projected energy at settlement
    unique_id: hass_energy_projected_settlement_energy
    default_entity_id: sensor.hass_energy_projected_settlement_energy
    device_class: energy
    state_class: measurement
    unit_of_measurement: kWh
    state: |-
      {% set used = states('sensor.hass_energy_settlement_energy') | float(0) %}
      {% set daily = states('sensor.hass_energy_settlement_daily_rate') | float(0) %}
      {% set left = states('sensor.hass_energy_settlement_days_remaining') | float(0) %}
      {{ (used + daily * left) | round(1) }}
    availability: |-
      {{ has_value('sensor.hass_energy_settlement_energy') and has_value('sensor.hass_energy_settlement_daily_rate') and has_value('sensor.hass_energy_settlement_days_remaining') }}
  - name: Projected cost at settlement
    unique_id: hass_energy_projected_settlement_cost
    default_entity_id: sensor.hass_energy_projected_settlement_cost
    state_class: measurement
    unit_of_measurement: Ft
    state: |-
      {% set total = states('sensor.hass_energy_projected_settlement_energy') | float(0) %}
      {% set cheap = [total, 2523.0] | min %}
      {% set dear = [total - 2523.0, 0] | max %}
      {{ (cheap * 36.386 + dear * 70.104) | round(0) }}
    availability: |-
      {{ has_value('sensor.hass_energy_projected_settlement_energy') }}
  - name: Date the subsidized allowance runs out
    unique_id: hass_energy_allowance_runs_out
    default_entity_id: sensor.hass_energy_allowance_runs_out
    state: |-
      {% set used = states('sensor.hass_energy_settlement_energy') | float(0) %}
      {% set daily = states('sensor.hass_energy_settlement_daily_rate') | float(0) %}
      {% set left = states('sensor.hass_energy_settlement_days_remaining') | float(0) %}
      {% set headroom = 2523.0 - used %}
      {% set days = headroom / daily if daily > 0 else -1 %}
      {{ (now() + timedelta(days=days)).date() if 0 <= days <= left else 'unknown' }}
    availability: |-
      {{ has_value('sensor.hass_energy_settlement_energy') and has_value('sensor.hass_energy_settlement_daily_rate') and has_value('sensor.hass_energy_settlement_days_remaining') }}
  binary_sensor:
  - name: Subsidized allowance projected to run out
    unique_id: hass_energy_allowance_projected_exceeded
    default_entity_id: binary_sensor.hass_energy_allowance_projected_exceeded
    state: |-
      {% set total = states('sensor.hass_energy_projected_settlement_energy') | float(0) %}
      {{ total > 2523.0 }}
    availability: |-
      {{ has_value('sensor.hass_energy_projected_settlement_energy') }}
