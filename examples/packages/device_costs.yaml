# Generated by hass-energy. Do not edit this file by hand; edits are lost on the next run.
# Change the project configuration or the generator instead.
#
# Cost of each monitored device per cycle, priced at the marginal rate: what the device
# costs to run right now. While the household is still inside the subsidized band these
# figures rise once the band is exhausted, and they are exact only at settlement.

template:
- sensor:
  - name: Heat pump cost daily
    unique_id: hass_energy_cost_heat_pump_daily
    default_entity_id: sensor.hass_energy_cost_heat_pump_daily
    state_class: total
    unit_of_measurement: Ft
    state: |-
      {% set energy = states('sensor.hass_energy_device_heat_pump_daily') | float(0) %}
      {% set price = states('sensor.hass_energy_marginal_price') | float(0) %}
      {{ (energy * price) | round(2) }}
    availability: |-
      {{ has_value('sensor.hass_energy_device_heat_pump_daily') and has_value('sensor.hass_energy_marginal_price') }}
    attributes:
      room: Utility room
      category: heating
