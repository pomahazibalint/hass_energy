# Generated by hass-energy. Do not edit this file by hand; edits are lost on the next run.
# Change the project configuration or the generator instead.
#
# Resets every settlement meter on the billing anniversary. The meters carry no cycle of
# their own, so this automation is what starts a new settlement period.

automation:
- id: hass_energy_settlement_reset
  alias: Reset settlement meters on 15 March
  description: Starts a new billing settlement period by calibrating every settlement meter back to zero.
  mode: single
  triggers:
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: template
    value_template: |-
      {{ now().month == 3 and now().day == 15 }}
  actions:
  - action: utility_meter.calibrate
    target:
      entity_id:
      - sensor.hass_energy_grid_import_settlement
      - sensor.hass_energy_grid_export_settlement
      - sensor.hass_energy_grid_production_settlement
      - sensor.hass_energy_device_heat_pump_settlement
      - sensor.hass_energy_device_water_heater_settlement
      - sensor.hass_energy_device_ev_charger_settlement
      - sensor.hass_energy_device_server_settlement
      - sensor.hass_energy_device_washing_machine_settlement
    data:
      value: '0'
