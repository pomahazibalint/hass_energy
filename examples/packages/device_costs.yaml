# Generated by hass-energy. Do not edit this file by hand; edits are lost on the next run.
# Change the project configuration or the generator instead.
#
# Cost of each monitored device per cycle. The settlement figure is exact: energy
# accumulates into a meter per price band, so each band is costed at its own price.
# Shorter cycles are costed at the price in force now, which differs from the billed
# amount only across the single day the allowance runs out.

template:
- sensor:
  - name: Heat pump cost daily
    unique_id: hass_energy_cost_heat_pump_daily
    default_entity_id: sensor.hass_energy_cost_heat_pump_daily
    state_class: total
    unit_of_measurement: Ft
    state: |-
      {% set energy = states('sensor.hass_energy_device_heat_pump_daily') | float(0) %}
      {% set price = states('sensor.hass_energy_marginal_price') | float(0) %}
      {{ (energy * price) | round(2) }}
    availability: |-
      {{ has_value('sensor.hass_energy_device_heat_pump_daily') and has_value('sensor.hass_energy_marginal_price') }}
    attributes:
      room: Utility room
      category: heating
  - name: Heat pump cost monthly
    unique_id: hass_energy_cost_heat_pump_monthly
    default_entity_id: sensor.hass_energy_cost_heat_pump_monthly
    state_class: total
    unit_of_measurement: Ft
    state: |-
      {% set energy = states('sensor.hass_energy_device_heat_pump_monthly') | float(0) %}
      {% set price = states('sensor.hass_energy_marginal_price') | float(0) %}
