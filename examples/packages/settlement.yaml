# Generated by hass-energy. Do not edit this file by hand; edits are lost on the next run.
# Change the project configuration or the generator instead.
#
# Resets every settlement meter on the billing anniversary, and keeps each device's meter
# recording into whichever price band is currently active. Without these the settlement
# period never restarts and all energy lands in the subsidized band.

automation:
- id: hass_energy_settlement_reset
  alias: Reset settlement meters on 15 March
  description: Starts a new billing settlement period by calibrating every settlement meter back to zero.
  mode: single
  triggers:
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: template
    value_template: |-
      {{ now().month == 3 and now().day == 15 }}
  actions:
  - action: utility_meter.calibrate
    target:
      entity_id:
      - sensor.hass_energy_grid_import_settlement
      - sensor.hass_energy_grid_export_settlement
      - sensor.hass_energy_grid_production_settlement
      - sensor.hass_energy_device_heat_pump_settlement_subsidized
      - sensor.hass_energy_device_heat_pump_settlement_unsubsidized
      - sensor.hass_energy_device_water_heater_settlement_subsidized
      - sensor.hass_energy_device_water_heater_settlement_unsubsidized
      - sensor.hass_energy_device_ev_charger_settlement_subsidized
      - sensor.hass_energy_device_ev_charger_settlement_unsubsidized
      - sensor.hass_energy_device_server_settlement_subsidized
      - sensor.hass_energy_device_server_settlement_unsubsidized
      - sensor.hass_energy_device_washing_machine_settlement_subsidized
      - sensor.hass_energy_device_washing_machine_settlement_unsubsidized
    data:
      value: '0'
- id: hass_energy_price_band
  alias: Follow the active energy price band
  description: Points every device settlement meter at the band its energy should be recorded against.
    Also runs at startup, so a band change missed while Home Assistant was down is corrected.
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.hass_energy_price_band
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: |-
      {{ states('sensor.hass_energy_price_band') in ['subsidized', 'unsubsidized'] }}
  actions:
  - action: select.select_option
    target:
      entity_id:
      - select.hass_energy_device_heat_pump_settlement
      - select.hass_energy_device_water_heater_settlement
      - select.hass_energy_device_ev_charger_settlement
      - select.hass_energy_device_server_settlement
      - select.hass_energy_device_washing_machine_settlement
    data:
      option: |-
        {{ states('sensor.hass_energy_price_band') }}
