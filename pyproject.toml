[build-system]
requires = ["uv_build>=0.11.26,<0.13"]
build-backend = "uv_build"

[project]
name = "hass-energy-accounting"
version = "0.1.0"
description = "Generator-driven Home Assistant energy accounting for annual settlement billing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
hass-energy = "hass_energy.cli:main"

[tool.uv]
package = true

[tool.uv.build-backend]
# The distribution is named for what it does; the module is named for what you
# import. Without this the backend looks for src/hass_energy_accounting.
module-name = "hass_energy"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "SIM", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict = true
