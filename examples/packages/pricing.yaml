# Generated by hass-energy. Do not edit this file by hand; edits are lost on the next run.
# Change the project configuration or the generator instead.
#
# Billed energy for the current settlement period, split into the subsidized and
# unsubsidized bands, with the resulting unit prices and cost. Every other cost sensor is
# priced from these.

template:
- sensor:
  - name: Billed energy this settlement period
    unique_id: hass_energy_settlement_energy
    device_class: energy
    state_class: total
    unit_of_measurement: kWh
    state: |-
      {% set imported = states('sensor.hass_energy_grid_import_settlement') | float(0) %}
      {% set exported = states('sensor.hass_energy_grid_export_settlement') | float(0) %}
      {{ [imported - exported, 0] | max | round(3) }}
    availability: |-
      {{ has_value('sensor.hass_energy_grid_import_settlement') and has_value('sensor.hass_energy_grid_export_settlement') }}
  - name: Subsidized energy used
    unique_id: hass_energy_subsidized_energy
    device_class: energy
    state_class: total
    unit_of_measurement: kWh
    state: |-
      {% set billed = states('sensor.hass_energy_settlement_energy') | float(0) %}
      {{ [billed, 2523.0] | min | round(3) }}
    availability: |-
      {{ has_value('sensor.hass_energy_settlement_energy') }}
  - name: Subsidized energy remaining
    unique_id: hass_energy_subsidized_remaining
    device_class: energy
    state_class: measurement
    unit_of_measurement: kWh
    state: |-
      {% set billed = states('sensor.hass_energy_settlement_energy') | float(0) %}
      {{ [2523.0 - billed, 0] | max | round(3) }}
    availability: |-
      {{ has_value('sensor.hass_energy_settlement_energy') }}
  - name: Unsubsidized energy used
    unique_id: hass_energy_unsubsidized_energy
    device_class: energy
    state_class: total
    unit_of_measurement: kWh
    state: |-
      {% set billed = states('sensor.hass_energy_settlement_energy') | float(0) %}
      {{ [billed - 2523.0, 0] | max | round(3) }}
    availability: |-
      {{ has_value('sensor.hass_energy_settlement_energy') }}
  - name: Marginal energy price
    unique_id: hass_energy_marginal_price
    state_class: measurement
    unit_of_measurement: Ft/kWh
    state: |-
      {% set billed = states('sensor.hass_energy_settlement_energy') | float(0) %}
      {{ 36.386 if billed < 2523.0 else 70.104 }}
    availability: |-
      {{ has_value('sensor.hass_energy_settlement_energy') }}
    attributes:
      tariff: A1
      band: |-
        {% set billed = states('sensor.hass_energy_settlement_energy') | float(0) %}
        {{ 'subsidized' if billed < 2523.0 else 'unsubsidized' }}
  - name: Settlement period cost
    unique_id: hass_energy_settlement_cost
    state_class: total
    unit_of_measurement: Ft
    state: |-
      {% set subsidized = states('sensor.hass_energy_subsidized_energy') | float(0) %}
      {% set unsubsidized = states('sensor.hass_energy_unsubsidized_energy') | float(0) %}
      {{ (subsidized * 36.386 + unsubsidized * 70.104) | round(2) }}
    availability: |-
      {{ has_value('sensor.hass_energy_subsidized_energy') and has_value('sensor.hass_energy_unsubsidized_energy') }}
  - name: Average energy price this settlement period
    unique_id: hass_energy_average_price
    state_class: measurement
    unit_of_measurement: Ft/kWh
    state: |-
      {% set billed = states('sensor.hass_energy_settlement_energy') | float(0) %}
      {% set cost = states('sensor.hass_energy_settlement_cost') | float(0) %}
      {{ (cost / billed) | round(3) if billed > 0 else 36.386 }}
    availability: |-
      {{ has_value('sensor.hass_energy_settlement_energy') and has_value('sensor.hass_energy_settlement_cost') }}
