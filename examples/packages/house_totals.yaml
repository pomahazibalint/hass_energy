# Generated by hass-energy. Do not edit this file by hand; edits are lost on the next run.
# Change the project configuration or the generator instead.
#
# House-wide consumption and cost per cycle. Consumption is grid import less export plus
# local production, so it reflects what the house used rather than what it bought.
# Whatever the monitored devices do not account for is reported as unmonitored.

template:
- sensor:
  - name: House consumption daily
    unique_id: hass_energy_house_energy_daily
    default_entity_id: sensor.hass_energy_house_energy_daily
    device_class: energy
    state_class: total
    unit_of_measurement: kWh
    state: |-
      {% set used = states('sensor.hass_energy_grid_import_daily') | float(0) %}
      {% set used = used - (states('sensor.hass_energy_grid_export_daily') | float(0)) %}
      {% set used = used + (states('sensor.hass_energy_grid_production_daily') | float(0)) %}
      {{ [used, 0] | max | round(3) }}
    availability: |-
      {{ has_value('sensor.hass_energy_grid_import_daily') and has_value('sensor.hass_energy_grid_export_daily') and has_value('sensor.hass_energy_grid_production_daily') }}
  - name: Monitored consumption daily
    unique_id: hass_energy_monitored_energy_daily
    default_entity_id: sensor.hass_energy_monitored_energy_daily
    device_class: energy
    state_class: total
    unit_of_measurement: kWh
    state: |-
      {% set meters = [
        'sensor.hass_energy_device_heat_pump_daily',
        'sensor.hass_energy_device_water_heater_daily',
        'sensor.hass_energy_device_ev_charger_daily',
        'sensor.hass_energy_device_washing_machine_daily',
      ] %}
      {{ meters | map('states') | map('float', 0) | sum | round(3) }}
  - name: Unmonitored consumption daily
    unique_id: hass_energy_unmonitored_energy_daily
    default_entity_id: sensor.hass_energy_unmonitored_energy_daily
    device_class: energy
    state_class: total
    unit_of_measurement: kWh
    state: |-
      {% set used = states('sensor.hass_energy_house_energy_daily') | float(0) %}
      {% set measured = states('sensor.hass_energy_monitored_energy_daily') | float(0) %}
      {{ [used - measured, 0] | max | round(3) }}
    availability: |-
      {{ has_value('sensor.hass_energy_house_energy_daily') and has_value('sensor.hass_energy_monitored_energy_daily') }}
  - name: Monitored cost daily
    unique_id: hass_energy_monitored_cost_daily
    default_entity_id: sensor.hass_energy_monitored_cost_daily
    state_class: total
    unit_of_measurement: Ft
    state: |-
      {% set costs = [
        'sensor.hass_energy_cost_heat_pump_daily',
        'sensor.hass_energy_cost_water_heater_daily',
        'sensor.hass_energy_cost_ev_charger_daily',
        'sensor.hass_energy_cost_washing_machine_daily',
      ] %}
      {{ costs | map('states') | map('float', 0) | sum | round(2) }}
  - name: Unmonitored cost daily
    unique_id: hass_energy_unmonitored_cost_daily
    default_entity_id: sensor.hass_energy_unmonitored_cost_daily
    state_class: total
    unit_of_measurement: Ft
    state: |-
      {% set energy = states('sensor.hass_energy_unmonitored_energy_daily') | float(0) %}
      {% set price = states('sensor.hass_energy_marginal_price') | float(0) %}
      {{ (energy * price) | round(2) }}
    availability: |-
      {{ has_value('sensor.hass_energy_unmonitored_energy_daily') and has_value('sensor.hass_energy_marginal_price') }}
  - name: Total cost daily
    unique_id: hass_energy_total_cost_daily
    default_entity_id: sensor.hass_energy_total_cost_daily
    state_class: total
    unit_of_measurement: Ft
    state: |-
      {% set measured = states('sensor.hass_energy_monitored_cost_daily') | float(0) %}
      {% set rest = states('sensor.hass_energy_unmonitored_cost_daily') | float(0) %}
      {{ (measured + rest) | round(2) }}
    availability: |-
      {{ has_value('sensor.hass_energy_monitored_cost_daily') and has_value('sensor.hass_energy_unmonitored_cost_daily') }}
  - name: Solar self-consumption daily
    unique_id: hass_energy_self_consumption_daily
    default_entity_id: sensor.hass_energy_self_consumption_daily
