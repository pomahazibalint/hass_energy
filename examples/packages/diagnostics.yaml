# Generated by hass-energy. Do not edit this file by hand; edits are lost on the next run.
# Change the project configuration or the generator instead.
#
# Health of the accounting: source sensors that are missing or have stopped updating, how
# much consumption no device accounts for, and whether the meter tariffs still follow the
# active price band. These detect an accounting that has quietly stopped being true.

template:
- sensor:
  - name: Unmonitored share daily
    unique_id: hass_energy_unmonitored_share_daily
    default_entity_id: sensor.hass_energy_unmonitored_share_daily
    state_class: measurement
    unit_of_measurement: '%'
    state: |-
      {% set used = states('sensor.hass_energy_house_energy_daily') | float(0) %}
      {% set rest = states('sensor.hass_energy_unmonitored_energy_daily') | float(0) %}
      {{ (rest / used * 100) | round(1) if used > 0 else 0 }}
    availability: |-
      {{ has_value('sensor.hass_energy_house_energy_daily') and has_value('sensor.hass_energy_unmonitored_energy_daily') }}
  - name: Unmonitored share monthly
    unique_id: hass_energy_unmonitored_share_monthly
    default_entity_id: sensor.hass_energy_unmonitored_share_monthly
    state_class: measurement
    unit_of_measurement: '%'
    state: |-
      {% set used = states('sensor.hass_energy_house_energy_monthly') | float(0) %}
      {% set rest = states('sensor.hass_energy_unmonitored_energy_monthly') | float(0) %}
      {{ (rest / used * 100) | round(1) if used > 0 else 0 }}
    availability: |-
      {{ has_value('sensor.hass_energy_house_energy_monthly') and has_value('sensor.hass_energy_unmonitored_energy_monthly') }}
  - name: Unmonitored share settlement period
    unique_id: hass_energy_unmonitored_share_settlement
    default_entity_id: sensor.hass_energy_unmonitored_share_settlement
    state_class: measurement
    unit_of_measurement: '%'
    state: |-
      {% set used = states('sensor.hass_energy_house_energy_settlement') | float(0) %}
      {% set rest = states('sensor.hass_energy_unmonitored_energy_settlement') | float(0) %}
      {{ (rest / used * 100) | round(1) if used > 0 else 0 }}
    availability: |-
      {{ has_value('sensor.hass_energy_house_energy_settlement') and has_value('sensor.hass_energy_unmonitored_energy_settlement') }}
  binary_sensor:
  - name: Energy source sensors unavailable
    unique_id: hass_energy_sources_unavailable
    default_entity_id: binary_sensor.hass_energy_sources_unavailable
    device_class: problem
    state: |-
      {% set sources = [
        'sensor.grid_import_energy',
        'sensor.grid_export_energy',
        'sensor.solar_production_energy',
        'sensor.heat_pump_energy',
        'sensor.water_heater_energy',
        'sensor.ev_charger_energy',
        'sensor.server_energy',
        'sensor.washing_machine_energy',
      ] %}
      {{ sources | reject('has_value') | list | count > 0 }}
    attributes:
      missing: |-
        {% set sources = [
          'sensor.grid_import_energy',
          'sensor.grid_export_energy',
          'sensor.solar_production_energy',
          'sensor.heat_pump_energy',
          'sensor.water_heater_energy',
          'sensor.ev_charger_energy',
          'sensor.server_energy',
          'sensor.washing_machine_energy',
        ] %}
        {{ sources | reject('has_value') | list | join(', ') }}
  - name: Energy source sensors not updating
    unique_id: hass_energy_sources_stale
    default_entity_id: binary_sensor.hass_energy_sources_stale
    device_class: problem
    state: |-
      {% set sources = [
        'sensor.grid_import_energy',
        'sensor.grid_export_energy',
        'sensor.solar_production_energy',
        'sensor.heat_pump_energy',
        'sensor.water_heater_energy',
        'sensor.ev_charger_energy',
        'sensor.server_energy',
        'sensor.washing_machine_energy',
      ] %}
      {% set cutoff = now() - timedelta(hours=6.0) %}
      {% set ns = namespace(stale=[]) %}
      {% for entity in sources if has_value(entity) %}
        {% if states[entity].last_updated < cutoff %}
          {% set ns.stale = ns.stale + [entity] %}
        {% endif %}
      {% endfor %}
      {% set stale = ns.stale %}
      {{ stale | count > 0 }}
    attributes:
      stale: |-
        {% set sources = [
          'sensor.grid_import_energy',
          'sensor.grid_export_energy',
          'sensor.solar_production_energy',
          'sensor.heat_pump_energy',
          'sensor.water_heater_energy',
          'sensor.ev_charger_energy',
          'sensor.server_energy',
          'sensor.washing_machine_energy',
        ] %}
        {% set cutoff = now() - timedelta(hours=6.0) %}
        {% set ns = namespace(stale=[]) %}
        {% for entity in sources if has_value(entity) %}
          {% if states[entity].last_updated < cutoff %}
            {% set ns.stale = ns.stale + [entity] %}
          {% endif %}
        {% endfor %}
        {% set stale = ns.stale %}
        {{ stale | join(', ') }}
      stale_after_hours: '6.0'
  - name: Too much consumption unaccounted for
    unique_id: hass_energy_attribution_poor
    default_entity_id: binary_sensor.hass_energy_attribution_poor
    device_class: problem
    state: |-
      {% set share = states('sensor.hass_energy_unmonitored_share_daily') | float(0) %}
      {{ share > 40.0 }}
    availability: |-
      {{ has_value('sensor.hass_energy_unmonitored_share_daily') }}
    attributes:
      threshold_percent: '40.0'
  - name: Meter tariffs do not match the price band
    unique_id: hass_energy_band_desync
    default_entity_id: binary_sensor.hass_energy_band_desync
    device_class: problem
    state: |-
      {% set selects = [
        'select.hass_energy_device_heat_pump_settlement',
        'select.hass_energy_device_water_heater_settlement',
        'select.hass_energy_device_ev_charger_settlement',
        'select.hass_energy_device_server_settlement',
        'select.hass_energy_device_washing_machine_settlement',
      ] %}
      {% set band = states('sensor.hass_energy_price_band') %}
      {{ selects | map('states') | reject('eq', band) | list | count > 0 }}
    availability: |-
      {{ has_value('sensor.hass_energy_price_band') }}
