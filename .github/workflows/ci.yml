name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      # Generated packages are committed, so a change to the generator that was
      # not followed by a regeneration has to fail the build.
      - name: Example packages are up to date
        run: >
          uv run hass-energy generate
          --config examples/config.yaml
          --output examples/packages
          --check

      # The integration ships its own copy of the settlement engine so it needs
      # nothing installed at runtime. That copy is an artifact like the packages.
      - name: Vendored engine is up to date
        run: uv run python scripts/vendor_billing.py --check

      # The dashboard is plain modules with no build step, so the one check
      # is that each parses. Node reads a file as a module only under .mjs.
      - name: Dashboard modules parse
        run: |
          for module in custom_components/hass_energy/www/*.js; do
            copy="$RUNNER_TEMP/$(basename "$module" .js).mjs"
            cp "$module" "$copy" && node --check "$copy"
          done

      - name: Versions agree
        run: uv run python scripts/check_version.py

      # HACS reads the installed version from the manifest and the available
      # one from the tag. If they part company it offers an update forever.
      - name: Release tag matches the manifest
        if: github.ref_type == 'tag'
        run: uv run python scripts/check_version.py --tag "${{ github.ref_name }}"

  # A tag is invisible to HACS; a GitHub release is what it offers as an
  # update. So the release is created here, only once everything that could
  # reject this tag has passed. A tag pushed with a broken build leaves no
  # release behind and nobody is offered anything.
  release:
    needs: [check, hassfest, home-assistant]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  # Validates the manifest the way Home Assistant will, which is not something
  # the integration's own tests can do: they import it, they do not vet it.
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  home-assistant:
    # Validates the generated YAML against Home Assistant's own schemas rather
    # than against this project's model of them. Home Assistant needs 3.13.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Assemble a Home Assistant configuration
        run: |
          mkdir -p ha-config/packages
          cp examples/packages/*.yaml ha-config/packages/
          printf 'homeassistant:\n  packages: !include_dir_named packages\n' \
            > ha-config/configuration.yaml

      # check_config exits 0 even when it rejects the configuration, so its
      # output is what decides the result.
      - name: Home Assistant configuration check
        run: |
          set -o pipefail
          uvx --python 3.13 --from homeassistant \
            hass --script check_config -c ha-config | tee check.log
          if grep -q 'Incorrect config' check.log; then
            echo '::error::Home Assistant rejected the generated packages'
            exit 1
          fi

      # check_config compiles templates but never renders one, and a template
      # that compiles can still fail on the first state it reads.
      - name: Render every generated template
        run: >
          uv run --python 3.13 --with homeassistant --no-project
          python scripts/render_check.py examples/packages

      # The integration needs Home Assistant to import at all, so its tests and
      # type check live with the job that has it. The frontend package is a
      # dependency of the integration, for the dashboard it serves, and Home
      # Assistant installs it at runtime rather than declaring it.
      - name: Integration tests
        run: >
          uv run --python 3.13 --with homeassistant --with home-assistant-frontend
          --with pytest-homeassistant-custom-component --no-project
          python -m pytest tests/integration -q -o asyncio_mode=auto -o addopts=

      - name: Integration types
        run: >
          uv run --python 3.13 --with homeassistant --with mypy --no-project
          python -m mypy --strict --python-version 3.13
          --explicit-package-bases custom_components
